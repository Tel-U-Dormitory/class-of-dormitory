name: cod-production

x-app: &app
  image: ${COD_IMAGE:?Set COD_IMAGE to a GHCR tag or digest}
  env_file: .env.production
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  extra_hosts:
    - host.docker.internal:host-gateway
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    stop_grace_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    stop_grace_period: 70s

volumes:
  storage:
