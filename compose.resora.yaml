# Reference for Resora/NPM + shared MySQL. Do not overwrite a live server file blindly.
name: cod-production

x-app: &app
  image: ${COD_IMAGE:?Set COD_IMAGE to a GHCR tag or digest}
  env_file: .env.production
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app
    networks:
      proxy:
        aliases:
          - cod-web
      database: {}
    stop_grace_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    networks:
      - database
    healthcheck:
      disable: true
    stop_grace_period: 70s

volumes:
  storage:

networks:
  proxy:
    external: true
    name: resora-proxy
  database:
    external: true
    name: resora-database
