# Optional: only for a NEW database managed by this Compose project.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 320m
    memswap_limit: 384m
    command: ["--performance-schema=OFF", "--mysqlx=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=24", "--thread-cache-size=4", "--table-open-cache=256", "--tmp-table-size=8M", "--max-heap-table-size=8M"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?Set a non-root DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
